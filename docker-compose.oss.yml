  CONVERSATION_SECRET_KEY: ${KLM_OSS_CHATTERMATE_CONVERSATION_SECRET:?run_scripts_start_oss_sidecars}
  CORS_ORIGINS: '["http://127.0.0.1:${KLM_OSS_CHATTERMATE_PORT:-3300}","http://localhost:${KLM_OSS_CHATTERMATE_PORT:-3300}"]'
  DATABASE_URL: postgresql+psycopg://chattermate:${KLM_OSS_CHATTERMATE_POSTGRES_PASSWORD:?run_scripts_start_oss_sidecars}@chattermate-postgres:5432/chattermate
  EMBEDDING_MAX_WORKERS: "2"
  EMBEDDING_SEQUENTIAL_FALLBACK: "true"
  EMBEDDING_SINGLE_THREADED: "true"
  ENABLE_IMMEDIATE_EMBEDDING: "true"
  ENCRYPTION_KEY: ${KLM_OSS_CHATTERMATE_ENCRYPTION_KEY:?run_scripts_start_oss_sidecars}
  ENVIRONMENT: production
  FIREBASE_CREDENTIALS: ${KLM_OSS_CHATTERMATE_FIREBASE_CREDENTIALS:-}
  FRONTEND_URL: http://127.0.0.1:${KLM_OSS_CHATTERMATE_PORT:-3300}
