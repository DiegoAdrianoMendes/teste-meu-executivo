  chattermate-temp:
    labels:
      com.klm.runtime: oss-local
      com.klm.data: chattermate-temp
  chattermate-uploads:
    labels:
      com.klm.runtime: oss-local
      com.klm.data: chattermate-uploads
  bottlecrm-media:
