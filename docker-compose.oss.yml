      com.klm.data: bottlecrm-media
  bottlecrm-postgres-data:
    labels:
      com.klm.runtime: oss-local
      com.klm.data: bottlecrm-postgres
  bottlecrm-redis-data:
    labels:
      com.klm.runtime: oss-local
      com.klm.data: bottlecrm-redis
  bottlecrm-static:
    labels:
      com.klm.runtime: oss-local
