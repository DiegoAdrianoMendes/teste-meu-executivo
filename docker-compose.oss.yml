  KLM_OSS_BOTTLECRM_ADMIN_NAME: ${KLM_OSS_BOTTLECRM_ADMIN_NAME:?run_scripts_start_oss_sidecars}
  SECRET_KEY: ${KLM_OSS_BOTTLECRM_SECRET_KEY:?run_scripts_start_oss_sidecars}
