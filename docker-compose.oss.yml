  GOOGLE_CLIENT_SECRET: ${KLM_OSS_BOTTLECRM_GOOGLE_CLIENT_SECRET:-}
  GOOGLE_REDIRECT_URI: http://127.0.0.1:${KLM_OSS_BOTTLECRM_PORT:-3400}/login
  KLM_BOTTLECRM_BRIDGE_SECRET: ${KLM_OSS_BOTTLECRM_BRIDGE_SECRET:?run_scripts_start_oss_sidecars}
