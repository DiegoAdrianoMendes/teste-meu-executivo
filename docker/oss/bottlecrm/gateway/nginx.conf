pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  proxy_buffer_size 32k;
  proxy_buffers 8 32k;
  proxy_busy_buffers_size 64k;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  upstream bottlecrm_backend {
    server bottlecrm-backend:8000;
    keepalive 16;
  }

  upstream bottlecrm_frontend {
    server bottlecrm-frontend:3000;
    keepalive 16;
  }

  server {
    listen 8080;
    server_name _;
    client_max_body_size 25m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    location = /healthz {
      access_log off;
      default_type application/json;
      return 200 '{"status":"healthy","component":"bottlecrm-gateway"}\n';
    }

    location = /__klm_session {
      proxy_pass http://host.docker.internal:8010/api/v1/oss-adapters/local-session/bottlecrm;
      proxy_http_version 1.1;
      proxy_set_header Host 127.0.0.1:8010;
      proxy_set_header X-Forwarded-Proto http;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_pass_request_body off;
    }

    location ~ ^/(?:api|admin|schema|swagger-ui|static|media|healthz/)(?:/|$) {
      proxy_pass http://bottlecrm_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto http;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_buffering off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    location / {
      proxy_pass http://bottlecrm_frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto http;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 120s;
    }
  }
}
