pid /tmp/nginx.pid;

events {
  worker_connections 256;
}

http {
  access_log off;
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  server {
    listen 8080;
    server_name _;
    client_max_body_size 25m;

    location /__klm_bridge/ {
      proxy_pass http://host.docker.internal:8010/;
      proxy_http_version 1.1;
      proxy_set_header Host 127.0.0.1:8010;
      proxy_set_header X-Forwarded-Proto http;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 30s;
    }

    location = /__klm_session {
      proxy_pass http://host.docker.internal:8010/api/v1/oss-adapters/local-session/rocketchat$is_args$args;
      proxy_http_version 1.1;
      proxy_set_header Host 127.0.0.1:8010;
      proxy_set_header X-Forwarded-Proto http;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_pass_request_body off;
    }

    location / {
      proxy_pass http://rocketchat:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto http;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_hide_header X-Frame-Options;
      proxy_read_timeout 300s;
    }
  }
}
