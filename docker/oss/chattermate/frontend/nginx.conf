pid /tmp/nginx.pid;

events {
  worker_connections 512;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  access_log /dev/stdout;
  error_log /dev/stderr warn;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  sendfile on;
  gzip on;
  gzip_types application/javascript application/json image/svg+xml text/css text/plain;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
      access_log off;
      default_type application/json;
      return 200 '{"status":"healthy","component":"chattermate-frontend"}\n';
    }

    location = /config.js {
      alias /tmp/chattermate-runtime/config.js;
      default_type application/javascript;
      add_header Cache-Control "no-store" always;
    }

    location = /swenv.js {
      alias /tmp/chattermate-runtime/swenv.js;
      default_type application/javascript;
      add_header Cache-Control "no-store" always;
    }

    location = /firebase-messaging-sw.js {
      add_header Cache-Control "no-cache" always;
      add_header Service-Worker-Allowed "/" always;
      try_files $uri =404;
    }

    location ~ ^/assets/widget\.(js|css)$ {
      add_header Access-Control-Allow-Origin "*" always;
      add_header Cache-Control "no-cache" always;
      try_files $uri =404;
    }

    location ^~ /webclient/ {
      add_header Access-Control-Allow-Origin "*" always;
      add_header Cache-Control "no-cache" always;
      try_files $uri =404;
    }

    location ~* \.(?:css|gif|ico|jpe?g|js|png|svg|webp|woff2?)$ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
      try_files $uri =404;
    }

    location / {
      add_header Cache-Control "no-cache" always;
      try_files $uri $uri/ /index.html;
    }
  }
}
