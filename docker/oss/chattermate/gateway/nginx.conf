pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  access_log /dev/stdout;
  error_log /dev/stderr warn;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  proxy_buffer_size 32k;
  proxy_buffers 8 32k;
  proxy_busy_buffers_size 64k;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream chattermate_api_upstream {
    server chattermate-api:8000;
    keepalive 16;
  }

  upstream chattermate_frontend_upstream {
    server chattermate-frontend:8080;
    keepalive 8;
  }

  # Unknown hosts are intentional here: verified custom help-center domains and
  # {slug}.HELP_CENTER_BASE_DOMAIN must reach the backend host dispatcher.
  server {
    listen 8080 default_server;
    server_name _;
    client_max_body_size 25m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    location = /healthz {
      access_log off;
      default_type application/json;
      return 200 '{"status":"healthy","component":"chattermate-gateway"}\n';
    }

    location ^~ /webclient/ {
      proxy_pass http://chattermate_frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
    }

    location ~ ^/assets/widget\.(js|css)$ {
      proxy_pass http://chattermate_frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
    }

    location /socket.io/ {
      proxy_pass http://chattermate_api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_cookie_flags ~ nosecure samesite=lax;
    }

    location / {
      proxy_pass http://chattermate_api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_buffering off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_cookie_flags ~ nosecure samesite=lax;
    }
  }

  # The local dashboard has exactly these loopback hostnames. Only this server
  # serves the SPA; API, WebSocket, widget, and documentation paths remain on
  # the same browser origin.
  server {
    listen 8080;
    server_name localhost 127.0.0.1;
    client_max_body_size 25m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; connect-src 'self' blob: ws://localhost:* ws://127.0.0.1:*; frame-src 'self'; frame-ancestors 'self'; form-action 'self'" always;

    location = /__klm_session {
      proxy_pass http://host.docker.internal:8010/api/v1/oss-adapters/local-session/chattermate;
      proxy_http_version 1.1;
      proxy_set_header Host 127.0.0.1:8010;
      proxy_set_header X-Forwarded-Proto http;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_pass_request_body off;
    }

    location = /healthz {
      access_log off;
      default_type application/json;
      return 200 '{"status":"healthy","component":"chattermate-gateway"}\n';
    }

    location = /health {
      proxy_pass http://chattermate_api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
    }

    location = /openapi.json {
      proxy_pass http://chattermate_api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
    }

    location ~ ^/(?:docs|redoc)(?:/|$) {
      proxy_pass http://chattermate_api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
    }

    # No trailing slash on proxy_pass: the backend must receive /api/v1, not
    # /v1. This is also where local HTTP auth cookies are normalized.
    location /api/ {
      proxy_pass http://chattermate_api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_buffering off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_cookie_flags ~ nosecure samesite=lax;
    }

    location /socket.io/ {
      proxy_pass http://chattermate_api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_buffering off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_cookie_flags ~ nosecure samesite=lax;
    }

    location / {
      proxy_pass http://chattermate_frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 60s;
    }
  }
}
