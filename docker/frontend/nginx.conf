worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    sendfile on;
    keepalive_timeout 30s;
    server_tokens off;
    # Backend accepts official WhatsApp documents up to 100 MiB; leave room for multipart.
    client_max_body_size 105m;

    gzip on;
    gzip_types application/javascript application/json application/xml image/svg+xml text/css text/plain;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self' https://api.meuexecutivo.com wss://api.meuexecutivo.com https://*.s3.amazonaws.com https://*.s3.us-east-1.amazonaws.com https://graph.facebook.com; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; frame-src https://www.facebook.com; img-src 'self' data: blob: https:; manifest-src 'self'; media-src 'self' blob: https://*.s3.amazonaws.com https://*.s3.us-east-1.amazonaws.com; object-src 'none'; script-src 'self' https://connect.facebook.net; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), clipboard-read=(), clipboard-write=(self), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), picture-in-picture=(), usb=()" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /health {
            access_log off;
            proxy_pass http://api:8000/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }

        # O app recusa /blackbox; o host interno serve somente /blackbox.
        include /etc/nginx/surface-routes.conf;

        location = /api/v1/ws {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 75s;
        }

        location /api/ {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location ~* \.(?:css|eot|gif|ico|jpe?g|js|mjs|png|svg|ttf|webp|woff2?)$ {
            expires 1y;
            try_files $uri =404;
        }
    }
}
