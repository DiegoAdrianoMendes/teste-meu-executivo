name: OSS census

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: oss-census-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  census:
    name: Deterministic OSS census
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LC_ALL: C.UTF-8
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      TZ: UTC

    steps:
      - name: Check out KLM
        uses: actions/checkout@v4

      - name: Install exact Python toolchain
        uses: actions/setup-python@v5
        with:
          python-version: 3.12.13
          check-latest: false
          cache: pip

      - name: Install OSS runtime and test dependencies
        run: python -m pip install -r requirements.txt -r requirements-test.txt

      - name: Materialize and verify pinned upstreams
        run: bash scripts/fetch_klm_upstreams.sh

      - name: Check committed census lock
        run: python scripts/census_oss_function_units.py --check

      - name: Run isolated OSS tests
        run: python -m pytest --confcutdir=tests/oss tests/oss -q

      - name: Prove repeatable generation
        run: |
          python scripts/census_oss_function_units.py --output "$RUNNER_TEMP/oss-census-first.json"
          python scripts/census_oss_function_units.py --output "$RUNNER_TEMP/oss-census-second.json"
          cmp "$RUNNER_TEMP/oss-census-first.json" "$RUNNER_TEMP/oss-census-second.json"
          sha256sum "$RUNNER_TEMP/oss-census-first.json" "$RUNNER_TEMP/oss-census-second.json"
