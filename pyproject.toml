[tool.poetry]
name = "klm-legal-hub-backend"
version = "0.1.0"
description = "Backend local do KLM Hub — FastAPI + PostgreSQL + WebSockets + agentes"
authors = ["KLM Advogados"]
readme = "README.md"
python = "^3.12"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
alembic = "^1.13.0"
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.9"
pydantic = {extras = ["email"], version = "^2.7.0"}
pydantic-settings = "^2.3.0"
jsonschema = "^4.23.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
pyjwt = "^2.10.1"
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.9"
redis = {extras = ["hiredis"], version = "^5.0.0"}
celery = {extras = ["redis"], version = "^5.4.0"}
httpx = "^0.27.0"
boto3 = "^1.34.0"
python-dotenv = "^1.0.0"
structlog = "^24.1.0"
langgraph = "^0.2.0"
langchain-core = "^0.3.0"
openai = "^1.40.0"
tenacity = "^8.5.0"
aiofiles = "^24.1.0"
phonenumbers = "^9.0.36"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^5.0.0"
httpx = "^0.27.0"
factory-boy = "^3.3.0"
aiosqlite = "^0.20.0"
ruff = "^0.5.0"
mypy = "^1.10.0"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
